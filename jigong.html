<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="濟公師父線上參拜：焚香、供酒、合十，投十元搖籤、擲筊請示，抽出籤詩與師父開示。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>濟公師父線上參拜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 單欄手機殿堂 — 神像在上、供桌居中、籤筒與擲筊在下；夜間廟宇單一視覺（刻意不切換明暗） */
:root{
  --lacquer:#2a0b0b; --lacquer-2:#3d1210; --vermilion:#b8261d; --gold:#e3b04b; --gold-soft:#f3d79a;
  --paper:#f6ead2; --ink:#2b1a10; --muted:#b9977a; --jiao:#c42a1f; --jiao-flat:#e9b08a;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--lacquer);color:var(--paper)}
body{font-family:var(--body);font-size:15px;line-height:1.6;
  background:radial-gradient(120% 60% at 50% 0%, #5a1a12 0%, var(--lacquer) 60%) var(--lacquer);min-height:100%}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.top{align-items:center}
.sound-hint{color:var(--gold-soft);font-size:12px;animation:hintNudge 1.2s ease-in-out infinite}
@keyframes hintNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.sound-hint{animation:none}}
.fun-note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.sound{appearance:none;background:none;border:1px solid #6b2a1e;color:var(--gold-soft);border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
header{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.plaque{font-family:var(--display);font-weight:900;font-size:clamp(26px,8vw,34px);letter-spacing:.18em;color:var(--gold);
  border:2px solid var(--gold);padding:6px 16px 6px 22px;background:linear-gradient(var(--vermilion),#8e1a14);box-shadow:0 0 0 4px var(--lacquer),0 0 0 5px var(--gold-soft) inset}
.sub{color:var(--muted);font-size:13px;letter-spacing:.08em}
.merit{font-variant-numeric:tabular-nums;color:var(--gold-soft);font-size:13px}

.altar{position:relative;height:260px;display:flex;justify-content:center;align-items:flex-end}
.altar>svg{max-width:100%;height:100%}
#figureImg{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(1.015,.985)}}
#smoke{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.halo{transition:opacity .8s;opacity:.3}
.altar.blessed .halo{opacity:.9}
.offer-item{opacity:0;transition:opacity .6s}
.offer-item.on{opacity:1}
#bottle{transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s ease}
#bottle.pour{transform:translate(-11px,-12px) rotate(62deg)}
#stream{opacity:0;stroke-dasharray:4 3;transition:opacity .2s}
#stream.on{opacity:.95;animation:flow .25s linear infinite}
@keyframes flow{to{stroke-dashoffset:-7}}
#cupWine{opacity:0;transition:opacity .8s .3s}
#altarWine.on #cupWine.full{opacity:.95}
/* 合十動畫 */
.hand{transform-box:view-box;transform-origin:130px 250px;transition:transform 1s cubic-bezier(.3,.7,.3,1),opacity .6s}
.hand-l{transform:translate(-110px,30px) rotate(-35deg);opacity:0}
.hand-r{transform:translate(110px,30px) rotate(35deg);opacity:0}
.hands-on .hand-l,.hands-on .hand-r{transform:none;opacity:1}
#handGlow{opacity:0;transform-box:fill-box;transform-origin:center}
.hands-on #handGlow{animation:glow 2.4s ease-out .9s infinite}
@keyframes glow{0%{opacity:.85;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.hands-on #handsInner{animation:bow 3.2s ease-in-out 1s infinite}
@keyframes bow{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

.stage,.panel{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:900px){
  .wrap{max-width:1180px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,460px);column-gap:56px;row-gap:16px;align-items:start;padding-block:20px 40px}
  .top,footer{grid-column:1 / -1}
  .stage{position:sticky;top:20px;min-height:calc(100vh - 120px);justify-content:center;gap:28px}
  .plaque{font-size:44px}
  .sub{font-size:15px}
  .altar{height:min(62vh,580px)}
  .panel{padding:24px;border:1px solid #5a2118;border-radius:16px;background:#22090888;gap:26px}
  .offer:hover,.again:hover{border-color:var(--gold)}
  .btn:not(:disabled):hover{filter:brightness(1.07)}
}
.step{display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--display);font-weight:700;color:var(--gold);font-size:16px;letter-spacing:.1em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.label small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.offer{appearance:none;border:1px solid #6b2a1e;background:var(--lacquer-2);color:var(--paper);border-radius:10px;padding:12px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:14px;cursor:pointer;transition:border-color .2s,background .2s,transform .1s;position:relative}
.offer svg{width:38px;height:38px}
.offer:active{transform:scale(.97)}
.offer[aria-pressed="true"]{border-color:var(--gold);background:#4e1812;box-shadow:0 0 14px #e3b04b44}
.offer[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:8px;color:var(--gold);font-size:12px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
.status{min-height:1.4em;font-size:13px;color:var(--gold-soft);text-align:center}

textarea{width:100%;box-sizing:border-box;min-height:88px;resize:vertical;border-radius:10px;border:1px solid #6b2a1e;background:#1e0807;color:var(--paper);font:inherit;padding:10px 12px}
textarea::placeholder{color:#8a6a55}
.hint{font-size:12px;color:var(--muted)}

.box{display:flex;align-items:center;gap:14px;padding-top:14px}
.tube{width:70px;height:96px;flex:none;transform-origin:50% 90%;overflow:visible}
.tube.shaking{animation:tilt 1.5s ease-in-out both}
@keyframes tilt{0%{transform:rotate(0)}12%{transform:rotate(30deg)}18%{transform:rotate(23deg) translateY(-4px)}24%{transform:rotate(33deg)}30%{transform:rotate(23deg) translateY(-4px)}36%{transform:rotate(33deg)}42%{transform:rotate(23deg) translateY(-4px)}48%{transform:rotate(33deg)}54%{transform:rotate(23deg) translateY(-4px)}60%{transform:rotate(33deg)}66%{transform:rotate(23deg) translateY(-4px)}74%{transform:rotate(32deg)}82%{transform:rotate(30deg)}100%{transform:rotate(0)}}
.tube.shaking .s{animation:jig .11s ease-in-out infinite alternate}
.tube.shaking .s:nth-child(2){animation-delay:-.05s}.tube.shaking .s:nth-child(4){animation-delay:-.08s}.tube.shaking .s:nth-child(5){animation-delay:-.03s}
@keyframes jig{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.tube.shaking #popStick{animation:rise 1.5s ease-in both}
@keyframes rise{0%{transform:translateY(0)}30%{transform:translateY(-3px)}55%{transform:translateY(-9px)}70%{transform:translateY(-16px)}79%{transform:translateY(-28px);opacity:1}80%,100%{transform:translateY(-28px);opacity:0}}
.fly{position:fixed;z-index:30;width:6px;height:44px;border-radius:2px;background:linear-gradient(90deg,#e6cc8f,#f7e7bd,#d7b56c);border-top:6px solid var(--vermilion);pointer-events:none;box-shadow:0 2px 4px #0006}
.spark{position:fixed;z-index:30;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--gold-soft);box-shadow:0 0 8px var(--gold);pointer-events:none}
.btn{flex:1;appearance:none;border:none;border-radius:999px;padding:14px 18px;font:inherit;font-weight:700;font-size:16px;letter-spacing:.06em;cursor:pointer;
  color:var(--ink);background:linear-gradient(180deg,var(--gold-soft),var(--gold));box-shadow:0 4px 0 #8a6420,0 6px 16px #0008;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 #8a6420}
.btn.red{background:linear-gradient(180deg,#d8463a,var(--vermilion));color:var(--paper);box-shadow:0 4px 0 #6e130e,0 6px 16px #0008}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#d9a63a 60%,#9a7020);display:grid;place-items:center;font-size:11px;font-weight:700;color:#5a3d0c;border:1px solid #9a7020;flex:none}
.drop{position:fixed;z-index:20;pointer-events:none;animation:drop .7s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes drop{to{transform:translateY(140px) rotateY(720deg);opacity:0}}

/* 擲筊 */
.jiao-panel{border:1px solid #6b2a1e;border-radius:12px;background:#1e0807;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.pending{display:flex;align-items:center;gap:12px}
.mini-stick{flex:none;width:30px;height:110px;border-radius:4px;background:linear-gradient(90deg,#e6cc8f,#f7e7bd,#d7b56c);color:var(--ink);
  font-family:var(--display);font-weight:900;writing-mode:vertical-rl;text-orientation:upright;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.08em;animation:pop .5s ease both}
@keyframes pop{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.pending p{margin:0;font-size:14px}
.jiao-panel{transition:border-color .5s,box-shadow .5s}
.jiao-panel.holy{border-color:var(--gold);box-shadow:0 0 26px #e3b04b55}
.floor{position:relative;height:160px;border-radius:8px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;gap:30px;padding-bottom:18px;box-sizing:border-box;
  background:linear-gradient(#2a0e0b 0 45%,transparent 45%),repeating-linear-gradient(90deg,#4a1d14 0 58px,#3d170f 58px 60px),#45190f}
.lane{position:relative;width:70px;height:40px}
.jb{position:absolute;inset:0}
.shadow{position:absolute;left:10px;right:10px;bottom:-7px;height:10px;border-radius:50%;background:#000a;filter:blur(2px)}
.block{width:70px;height:40px;display:block}
.jiao-result{text-align:center;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.12em;min-height:1.4em;color:var(--gold)}
.jiao-result.no{color:#c9b6a0}
.jiao-result.holy{font-size:28px;text-shadow:0 0 12px #ffd98a,0 0 26px #e3b04b88}
.stamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.jiao-note{text-align:center;font-size:13px;color:var(--muted);margin-top:-8px;min-height:1.2em}

.result{display:flex;gap:14px;align-items:stretch}
.stick{flex:none;width:64px;border-radius:6px;background:linear-gradient(90deg,#e6cc8f,#f7e7bd,#d7b56c);color:var(--ink);
  font-family:var(--display);font-weight:900;writing-mode:vertical-rl;text-orientation:upright;display:flex;align-items:center;justify-content:center;font-size:22px;letter-spacing:.12em;padding:14px 0;border:1px solid #9a7a3a}
.stick .lvl{color:var(--vermilion);font-size:30px}
.stick.bad .lvl{color:#3c4f66}
.poem{flex:1;min-width:0;background:var(--paper);color:var(--ink);border-radius:8px;padding:14px 14px 12px;position:relative;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,#e7d6b4 27px 28px)}
.poem h3{margin:0 0 6px;font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.06em}
.poem .wish{font-size:12px;color:#7a5a40;margin:0 0 8px;overflow-wrap:anywhere}
.poem .reply{margin:0 0 30px;white-space:pre-wrap;font-family:var(--display);font-weight:500;font-size:15px;line-height:1.85;overflow-wrap:anywhere}
.seal{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border:2px solid var(--vermilion);color:var(--vermilion);border-radius:6px;
  font-family:var(--display);font-weight:900;font-size:13px;line-height:1.1;display:grid;place-items:center;text-align:center;transform:rotate(-8deg);opacity:.75}
.again{align-self:center;appearance:none;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:8px 18px;font:inherit;cursor:pointer}
footer{font-size:11px;color:#8a6a55;text-align:center}
.fade-in{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top"><span class="sound-hint" id="soundHint" hidden>這頁有音效喔，點這裡開啟 →</span><button class="sound" id="soundBtn" aria-pressed="false">音效：關</button></div>
  <div class="stage">
  <header>
    <div class="plaque">濟公活佛</div>
    <div class="sub">誠心參拜 · 投十元 · 擲筊請籤</div>
    <div class="merit" id="merit">累計香油錢 NT$0</div>
    <div class="fun-note">※ 僅供娛樂參考</div>
  </header>

  <div class="altar" id="altar">
    <svg viewBox="0 0 260 260" id="altarSvg" aria-label="濟公師父神像與供桌">
      <defs>
        <radialGradient id="hg"><stop offset="0" stop-color="#ffd98a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
        <linearGradient id="skin" x1="0" x2="1"><stop offset="0" stop-color="#e9c29a"/><stop offset="1" stop-color="#f6d6b2"/></linearGradient>
      </defs>
      <circle class="halo" cx="130" cy="92" r="92" fill="url(#hg)"/>
      <rect x="20" y="196" width="220" height="16" rx="3" fill="#7a1d14" stroke="#e3b04b"/>
      <rect x="8" y="212" width="244" height="40" rx="3" fill="#5c140f" stroke="#e3b04b"/>
      <!-- 神像（可替換為使用者提供的圖片） -->
      <g id="figure">
        <path d="M78 196 Q84 128 130 118 Q176 128 182 196 Z" fill="#8a5a2c"/>
        <path d="M96 196 Q104 140 130 132 Q150 140 160 196 Z" fill="#a8743c"/>
        <path d="M108 132 L152 196" stroke="#5e3a18" stroke-width="5"/>
        <circle cx="130" cy="96" r="24" fill="#e8c39a"/>
        <path d="M118 102 q4 5 9 0 M133 102 q4 5 9 0" stroke="#5a3418" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M121 112 q9 8 18 0" stroke="#7a3b1c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M100 84 Q130 36 160 84 Q130 74 100 84Z" fill="#4a3a2a"/>
        <rect x="104" y="80" width="52" height="8" rx="2" fill="#3a2c1f"/>
        <text x="130" y="68" font-size="14" font-family="serif" text-anchor="middle" fill="#e3b04b" font-weight="700">佛</text>
        <g transform="translate(178 116) rotate(22)">
          <path d="M0 0 L-26 -40 A48 48 0 0 1 26 -40 Z" fill="#d9c08a" stroke="#6b4a1e"/>
          <path d="M0 0 L-12 -45 M0 0 L0 -48 M0 0 L12 -45" stroke="#6b4a1e" stroke-width="1"/>
          <path d="M8 -46 l6 10 -8 2z" fill="#2a0b0b"/>
          <rect x="-2" y="0" width="4" height="20" fill="#6b4a1e"/>
        </g>
        <g transform="translate(94 156)">
          <circle cx="0" cy="22" r="14" fill="#c98a2e" stroke="#7a4a12"/>
          <circle cx="0" cy="1" r="9" fill="#c98a2e" stroke="#7a4a12"/>
          <rect x="-3" y="-13" width="6" height="6" fill="#7a1d14"/>
          <path d="M-11 12 q11 4 22 0" stroke="#b8261d" stroke-width="2.5" fill="none"/>
        </g>
      </g>
      <image id="figureImg" x="50" y="0" width="160" height="210" preserveAspectRatio="xMidYMax meet" style="display:none"/>
      <!-- 蠟燭 -->
      <rect x="26" y="168" width="8" height="28" fill="#b8261d"/><path d="M30 159 q4 5 0 9 q-4 -4 0 -9" fill="#ffcc55"><animate attributeName="opacity" values="1;.7;1" dur="1.3s" repeatCount="indefinite"/></path>
      <rect x="226" y="168" width="8" height="28" fill="#b8261d"/><path d="M230 159 q4 5 0 9 q-4 -4 0 -9" fill="#ffcc55"><animate attributeName="opacity" values=".8;1;.8" dur="1.1s" repeatCount="indefinite"/></path>
      <!-- 高粱酒 -->
      <g id="altarWine" class="offer-item">
        <g id="bottle"><rect x="44" y="170" width="16" height="26" rx="3" fill="#e6e6e6"/><rect x="48" y="161" width="8" height="10" fill="#e6e6e6"/><rect x="44" y="178" width="16" height="9" fill="#b8261d"/><text x="52" y="185" font-size="5.5" text-anchor="middle" fill="#fff">高粱</text></g>
        <path id="stream" d="M72 169 Q72.5 179 71 189" stroke="#f3e9c8" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M64 188 h14 l-2 8 h-10 z" fill="#f2efe6" stroke="#b9a98a"/>
        <path id="cupWine" d="M65.5 190 h11 l-1 3.5 h-9 z" fill="#efd78f"/>
      </g>
      <!-- 香爐 -->
      <g id="altarIncense" class="offer-item">
        <rect x="160" y="184" width="30" height="12" rx="3" fill="#8a6420" stroke="#e3b04b"/>
        <path d="M169 184 V150 M175 184 V146 M181 184 V150" stroke="#7a4a20" stroke-width="2"/>
        <circle cx="169" cy="150" r="2" fill="#ff7a3a"/><circle cx="175" cy="146" r="2" fill="#ff7a3a"/><circle cx="181" cy="150" r="2" fill="#ff7a3a"/>
      </g>
      <!-- 合十雙手 -->
      <g id="hands">
        <circle id="handGlow" cx="130" cy="196" r="34" fill="none" stroke="#ffd98a" stroke-width="3"/>
        <g id="handsInner">
          <g class="hand hand-l">
            <path d="M102 260 L104 240 C100 222 104 204 112 192 C117 184 123 178 129 175 L130 175 L130 248 L124 260 Z" fill="url(#skin)" stroke="#a87a4a" stroke-width="1.2"/>
            <path d="M113 214 C108 206 107 198 112 196 C116 196 118 204 120 212" fill="#f0cfa8" stroke="#a87a4a" stroke-width="1"/>
            <path d="M125 186 L125 214 M120 194 L120 214" stroke="#c89a6c" stroke-width=".9"/>
            <rect x="96" y="246" width="32" height="14" fill="#8a5a2c"/>
          </g>
          <g class="hand hand-r">
            <g transform="translate(260 0) scale(-1 1)">
              <path d="M102 260 L104 240 C100 222 104 204 112 192 C117 184 123 178 129 175 L130 175 L130 248 L124 260 Z" fill="url(#skin)" stroke="#a87a4a" stroke-width="1.2"/>
              <path d="M113 214 C108 206 107 198 112 196 C116 196 118 204 120 212" fill="#f0cfa8" stroke="#a87a4a" stroke-width="1"/>
              <path d="M125 186 L125 214 M120 194 L120 214" stroke="#c89a6c" stroke-width=".9"/>
              <rect x="96" y="246" width="32" height="14" fill="#8a5a2c"/>
            </g>
          </g>
        </g>
      </g>
    </svg>
    <canvas id="smoke"></canvas>
  </div>
  </div>

  <div class="panel">

  <section class="step">
    <div class="label">一、供奉 <small>可複選，三樣一起也行</small></div>
    <div class="offers" role="group" aria-label="供奉方式">
      <button class="offer" data-k="wine" aria-pressed="false">
        <svg viewBox="0 0 40 40"><rect x="13" y="12" width="14" height="24" rx="3" fill="#eee"/><rect x="16" y="4" width="8" height="9" fill="#eee"/><rect x="13" y="20" width="14" height="8" fill="#b8261d"/><text x="20" y="26.5" font-size="6" text-anchor="middle" fill="#fff">高粱</text></svg>
        供高粱酒
      </button>
      <button class="offer" data-k="incense" aria-pressed="false">
        <svg viewBox="0 0 40 40"><path d="M14 36 V10 M20 36 V6 M26 36 V10" stroke="#c99a5a" stroke-width="2.4"/><circle cx="14" cy="10" r="2" fill="#ff7a3a"/><circle cx="20" cy="6" r="2" fill="#ff7a3a"/><circle cx="26" cy="10" r="2" fill="#ff7a3a"/></svg>
        焚香
      </button>
      <button class="offer" data-k="pray" aria-pressed="false">
        <svg viewBox="0 0 40 40"><path d="M20 6 C16 12 12 20 12 28 L16 36 H20 Z" fill="#e8c39a" stroke="#a87a4a"/><path d="M20 6 C24 12 28 20 28 28 L24 36 H20 Z" fill="#f0d0aa" stroke="#a87a4a"/></svg>
        雙手合十
      </button>
    </div>

  let ac=null,noiseBuf=null,soundOn=false;
  try{soundOn=localStorage.getItem("jg-sound")==="on"}catch(e){}
  const sb=$("soundBtn");const showSound=()=>{sb.textContent="音效："+(soundOn?"開":"關");sb.setAttribute("aria-pressed",soundOn);$("soundHint").hidden=soundOn};showSound();
  sb.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("jg-sound",soundOn?"on":"off")}catch(e){}showSound();if(soundOn)bell(.5)};
  function A(){
    if(!soundOn)return null;
    try{
      if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
        noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
      if(ac.state==="suspended")ac.resume();
      return ac;
    }catch(e){return null}
  }
  function env(g,t,peak,att,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec)}
  function tone(f,dur,peak,type="sine",when=0){const a=A();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;env(g,t,peak,.005,dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
  function noise(dur,peak,freq,q=1,when=0,type="bandpass"){const a=A();if(!a)return;const t=a.currentTime+when,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q;env(g,t,peak,.004,dur);s.connect(f).connect(g).connect(a.destination);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
  const coinSnd=()=>{tone(2650,.35,.12);tone(3980,.25,.06);tone(2650,.25,.08,"sine",.13);tone(5200,.15,.03,"sine",.13);noise(.08,.15,500,1,.45)};
  const rattle=(d=1)=>{for(let i=0;i<d/.055;i++)noise(.035,.22+Math.random()*.12,1600+Math.random()*1400,5,i*.055+Math.random()*.02)};
  const clack=(w,v=1)=>{noise(.05,.55*v,950,3,w);tone(310,.09,.22*v,"triangle",w);tone(620,.05,.08*v,"square",w)};
  const tossSnd=()=>{noise(.1,.08,3000,1,0,"highpass");clack(.64);clack(.69,.9);clack(.76,.4);clack(.8,.35)};
  function bell(v=1){[[528,1],[1342,.35],[2450,.15],[3870,.06]].forEach(([f,a])=>{const c=A();if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;env(g,t,.18*a*v,.008,3.2);o.connect(g).connect(c.destination);o.start(t);o.stop(t+3.3)})}
  const pourSnd=()=>{for(let i=0;i<10;i++)noise(.12,.12,380+Math.random()*300,6,.15+i*.08,"bandpass")};
  const igniteSnd=()=>{noise(.35,.12,4500,.7,0,"highpass");noise(.6,.05,1200,.5,.2,"lowpass")};
  const chimeSnd=()=>{tone(880,1.2,.07);tone(1320,1.4,.05,"sine",.18)};

  let merit=0;try{merit=parseInt(localStorage.getItem("jg-merit")||"0",10)||0}catch(e){}
  const showMerit=()=>{$("merit").textContent="累計香油錢 NT$"+merit.toLocaleString("zh-TW")};showMerit();

  /* ---------- 香煙 ---------- */
  const cv=$("smoke"),ctx=cv.getContext("2d");let parts=[],smokeOn=false;
  const fit=()=>{const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio};fit();addEventListener("resize",fit);
  function svgPt(x,y){const s=$("altarSvg").getBoundingClientRect(),c=cv.getBoundingClientRect(),k=Math.min(s.width/260,s.height/260);
    return[(s.left-c.left+(s.width-260*k)/2+x*k)*devicePixelRatio,(s.top-c.top+(s.height-260*k)/2+y*k)*devicePixelRatio]}
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    if(smokeOn&&parts.length<70&&Math.random()<.55){const tip=[[169,150],[175,146],[181,150]][Math.floor(Math.random()*3)];const[x,y]=svgPt(tip[0],tip[1]);
      parts.push({x,y,a:.35,s:1.5+Math.random()*1.5,vx:(Math.random()-.5)*.3,ph:Math.random()*6})}
    parts.forEach(p=>{p.y-=.65*devicePixelRatio;p.ph+=.04;p.x+=Math.sin(p.ph)*.5+p.vx;p.s+=.06;p.a-=.0033;
      ctx.fillStyle="rgba(222,208,194,"+Math.max(p.a,0)+")";ctx.beginPath();ctx.arc(p.x,p.y,p.s*devicePixelRatio,0,7);ctx.fill()});
    parts=parts.filter(p=>p.a>0);requestAnimationFrame(tick)}
  if(!reduce)tick();

  /* ---------- 供奉（可複選） ---------- */
  const offers=new Set();
  const OFFER_NAME={wine:"一瓶高粱酒",incense:"三炷清香",pray:"雙手合十"};
  const OFFER_MSG={wine:"酒香飄出來，師父笑嘻嘻收下了。",incense:"清香裊裊，師父知道你來了。",pray:"心誠則靈，師父點點頭。"};
  document.querySelectorAll(".offer").forEach(b=>b.addEventListener("click",async()=>{
    const k=b.dataset.k,on=!offers.has(k);
    on?offers.add(k):offers.delete(k);
    b.setAttribute("aria-pressed",on);
    if(k==="wine"){$("altarWine").classList.toggle("on",on);
      $("cupWine").classList.remove("full");
      if(on){await wait(250);$("bottle").classList.add("pour");await wait(450);pourSnd();$("stream").classList.add("on");$("cupWine").classList.add("full");await wait(1100);$("stream").classList.remove("on");$("bottle").classList.remove("pour")}}
    if(k==="incense"){$("altarIncense").classList.toggle("on",on);smokeOn=on;if(on)igniteSnd()}
    if(k==="pray"){$("hands").classList.toggle("hands-on",on);if(on){chimeSnd();setTimeout(()=>bell(.6),900)}}
    $("altar").classList.toggle("blessed",offers.size>0);
    $("status").textContent=on?OFFER_MSG[k]:(offers.size?"已供奉："+[...offers].map(x=>OFFER_NAME[x]).join("、"):"請選擇供奉方式");
    if(phase==="idle"||phase==="redraw"||phase==="done")$("draw").disabled=offers.size===0;
  }));

  /* ---------- 籤 ---------- */
  const LEVELS=[{k:"大吉",w:10,good:true},{k:"上吉",w:15,good:true},{k:"中吉",w:25,good:true},{k:"小吉",w:22,good:true},{k:"凶",w:18,good:false},{k:"大凶",w:10,good:false}];
  const NUM="一二三四五六七八九十";
  const toCn=n=>n<=10?NUM[n-1]:n<20?"十"+NUM[n-11]:NUM[Math.floor(n/10)-1]+"十"+(n%10?NUM[n%10-1]:"");
  const LV=Object.fromEntries(LEVELS.map(l=>[l.k,l]));
  let phase="idle",cur=null;

  /* 筊杯繪製：flat=平面朝上(陽)、false=凸面朝上(陰) */
  function drawBlock(el,flat,mirror){
    const m=mirror?' transform="translate(70 0) scale(-1 1)"':'';
    el.innerHTML=flat
      ?`<g${m}><path d="M4 30 Q8 6 40 6 Q66 8 66 22 Q50 18 30 22 Q14 26 4 30Z" fill="var(--jiao-flat)" stroke="#7a2a14" stroke-width="1.5"/><path d="M12 26 Q30 18 58 18" stroke="#c98a62" stroke-width="1" fill="none"/></g>`
      :`<defs><linearGradient id="g${el.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ee5a46"/><stop offset="1" stop-color="#8e1a12"/></linearGradient></defs><g${m}><path d="M4 32 Q8 4 40 4 Q66 6 66 22 Q56 30 30 31 Q14 32 4 32Z" fill="url(#g${el.id})" stroke="#5e110b" stroke-width="1.5"/><path d="M16 14 Q32 8 52 10" stroke="#ffb3a0" stroke-width="2" fill="none" opacity=".6"/></g>`;
  }
  drawBlock($("b1"),true,false);drawBlock($("b2"),false,true);

  /* 籤枝飛出筒口、落地 */
  function flyStick(r0){
    const k=r0.width/70,ox=r0.left+35*k,oy=r0.top+86.4*k;
    const el=document.createElement("div");el.className="fly";
    el.style.left=(ox+44*k-3)+"px";el.style.top=(oy-78*k-25)+"px";document.body.appendChild(el);
    const an=el.animate([
      {transform:"rotate(30deg)",easing:"cubic-bezier(.2,.7,.4,1)"},
      {transform:"translate(24px,-36px) rotate(130deg)",offset:.35,easing:"cubic-bezier(.6,0,.9,.5)"},
      {transform:"translate(46px,64px) rotate(268deg)",offset:.8,easing:"ease-out"},
      {transform:"translate(49px,54px) rotate(262deg)",offset:.88,easing:"ease-in"},
      {transform:"translate(50px,64px) rotate(270deg)",offset:.96},
      {transform:"translate(50px,64px) rotate(270deg)",opacity:1}
    ],{duration:780,fill:"forwards"});
    setTimeout(()=>clack(0,.6),620);setTimeout(()=>clack(0,.25),740);
    an.finished.then(()=>el.animate([{opacity:1},{opacity:0}],{duration:350,fill:"forwards"}).finished).then(()=>el.remove());
  }

  /* 擲筊動畫：合掌搖一搖 → 拋高翻轉 → 落地彈跳 */
  async function toss(a,b){
    const W=[$("w1"),$("w2")],S=[$("s1"),$("s2")],B=[$("b1"),$("b2")],dir=[1,-1],fin=[a,b];
    if(reduce){drawBlock(B[0],a,false);drawBlock(B[1],b,true);clack(0);return}
    const gather=[];
    W.forEach((w,i)=>{const d=dir[i],x=32*d;
      gather.push(w.animate([{transform:"translate(0,0)"},
        {transform:`translate(${x}px,-30px) rotate(${-12*d}deg)`,offset:.3},
        {transform:`translate(${x}px,-38px) rotate(${10*d}deg)`,offset:.5},
        {transform:`translate(${x}px,-30px) rotate(${-10*d}deg)`,offset:.7},
        {transform:`translate(${x}px,-38px) rotate(0deg)`}],{duration:620,easing:"ease-in-out",fill:"forwards"}));
      gather.push(S[i].animate([{transform:"translateX(0) scale(1)"},{transform:`translateX(${x}px) scale(.7)`,opacity:.6}],{duration:620,fill:"forwards"}));
    });
    clack(.2,.22);clack(.36,.18);clack(.5,.22);
    await gather[0].finished;
    noise(.25,.08,2500,.6,0,"highpass");
    const runs=W.map((w,i)=>new Promise(done=>{
      const d=dir[i],x0=32*d,D=i?1380:1260,sp=d*720;
      const an=w.animate([
        {transform:`translate(${x0}px,-38px) rotate(0deg)`,easing:"cubic-bezier(.15,.6,.35,1)"},
        {transform:`translate(${x0*.5}px,-112px) rotate(${sp*.5}deg)`,offset:.38,easing:"cubic-bezier(.55,0,.9,.45)"},
        {transform:`translate(${-6*d}px,0) rotate(${sp*.95}deg)`,offset:.7,easing:"cubic-bezier(.2,.6,.4,1)"},
        {transform:`translate(${-3*d}px,-18px) rotate(${sp*.985}deg)`,offset:.8,easing:"cubic-bezier(.6,0,.9,.5)"},
        {transform:`translate(0,0) rotate(${sp}deg)`,offset:.9,easing:"ease-out"},
        {transform:`translate(0,-3px) rotate(${sp}deg)`,offset:.95,easing:"ease-in"},
        {transform:`translate(0,0) rotate(${sp}deg)`}],{duration:D,fill:"forwards"});
      const sh=S[i].animate([
        {transform:`translateX(${x0}px) scale(.7)`,opacity:.6},
        {transform:`translateX(${x0*.5}px) scale(.3)`,opacity:.25,offset:.38},
        {transform:`translateX(${-6*d}px) scale(1)`,opacity:1,offset:.7},
        {transform:`translateX(${-3*d}px) scale(.8)`,opacity:.8,offset:.8},
        {transform:"translateX(0) scale(1)",opacity:1}],{duration:D,fill:"forwards"});
      const flip=B[i].animate([{transform:"scaleY(1)"},{transform:"scaleY(-1)"}],{duration:110,iterations:Math.floor(D*.7/110),direction:"alternate",easing:"ease-in-out"});
      let face=Math.random()<.5;
      const iv=setInterval(()=>{face=!face;drawBlock(B[i],face,i===1)},110);
      setTimeout(()=>{clearInterval(iv);flip.cancel();drawBlock(B[i],fin[i],i===1);clack(0,1)},D*.7);
      setTimeout(()=>clack(0,.35),D*.9);
      an.finished.then(()=>{gather.forEach(g=>g.cancel());an.cancel();sh.cancel();done()});
    }));
    await Promise.all(runs);
  }

  function burst(el){
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(let i=0;i<16;i++){const s=document.createElement("span");s.className="spark";s.style.left=cx+"px";s.style.top=cy+"px";document.body.appendChild(s);

  }
